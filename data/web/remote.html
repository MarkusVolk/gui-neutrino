<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#191c22">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Remote - Neutrino</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css">
<style>
	html, body { background: #191c22; overflow: hidden; overscroll-behavior: none; }
	.phone {
		position: fixed;
		inset: 0;
		padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
			max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
		display: grid;
		grid-template-rows: 1fr auto;
	}
	.phone .remote { min-height: 0; }
	.phone .bar { display: flex; justify-content: space-between; align-items: center; padding-top: 6px; color: #8b95a6; font-size: 13px; }
	.phone .bar a, .phone .bar button { color: #8b95a6; background: none; border: none; padding: 6px 8px; text-decoration: none; cursor: pointer; }
	.phone .msg { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: rgb(25 28 34 / .94); color: #d7dce5; }
	.phone .msg[hidden] { display: none; }
	.phone .msg .btn { margin-top: 14px; }
</style>
<script type="module" src="/js/remote-page.js"></script>
</head>
<body>
<div class="phone">
	<div class="remote" id="remote"></div>
	<div class="bar">
		<a href="/">Full interface</a>
		<span id="status"></span>
		<button id="full" type="button">Full screen</button>
	</div>
	<div class="msg" id="msg" hidden></div>
</div>
</body>
</html>
